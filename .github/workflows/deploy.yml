name: Deploy Control Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CONTROL_VPS_HOST }}
          username: ${{ secrets.CONTROL_VPS_USER }}
          key: ${{ secrets.CONTROL_VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd ${{ secrets.CONTROL_VPS_PATH }}
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            docker compose -f docker-compose.server.yml up -d --build

      - name: Notify Telegram
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.DEPLOY_BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.DEPLOY_CHAT_ID }} \
            -d text="✅ Control deploy завершён: ${{ github.repository }} (${{
              github.ref_name
            }})"
